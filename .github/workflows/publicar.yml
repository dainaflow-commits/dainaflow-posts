name: Publicar no Instagram

on:
  schedule:
    - cron: "*/15 * * * *"   # a cada 15 minutos
  workflow_dispatch: {}       # botão "Run workflow" para rodar na hora
  push:                       # roda na hora sempre que a agenda muda
    branches: [main]
    paths:
      - "automacao/agenda.json"
      - "automacao/publicar.py"
      - ".github/workflows/publicar.yml"

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar o que chegou no horário
        env:
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: python automacao/publicar.py
      - name: Guardar o registro
        run: |
          git config user.name "daina-flow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add automacao/publicados.json
          [ -f automacao/token.enc ] && git add automacao/token.enc
          git diff --cached --quiet || (git commit -m "Registro de publicação" && git pull --rebase -q && git push)
